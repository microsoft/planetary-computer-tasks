name: CI/CD

on:
  push:
    branches: [main]
    tags: ["*"]

env:
  PCTASKS_COSMOSDB__URL: ${{ secrets.COSMOSDB_URL }}
  PCTASKS_COSMOSDB__TEST_CONTAINER_SUFFIX: ${{ github.run_id }}

permissions:
  id-token: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get image tag
        id: get_image_tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              tag="latest"
              ;;
          esac
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Log in with Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install local dependencies
        run: ./scripts/install

      - name: Setup
        run: ./scripts/setup --no-aux-servers

      - name: Test
        run: ./scripts/test

      - name: Validate collections
        run: ./scripts/validate-collections

      # Integration Tests

      - name: Install Kind
        uses: helm/kind-action@v1.4.0
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.8.2
        if: ${{ github.base_ref  == 'main' }}

      - name: Setup cluster
        run: ./scripts/cluster setup

      # Disable integration tests for now
      # - name: Run integration tests
      #   run: ./scripts/citest-integration

      # Publish images

      - name: Publish images (test)
        env:
          IMAGE_TAG: ${{ steps.get_image_tag.outputs.tag }}
        run: ./scripts/publish --acr pccomponentstest --tag "$IMAGE_TAG"

      - name: Publish images
        env:
          IMAGE_TAG: ${{ steps.get_image_tag.outputs.tag }}
        run: ./scripts/publish --acr pccomponents --tag "$IMAGE_TAG"

      - name: Clean up CosmosDB test containers
        run: ./scripts/setup --rm-test-containers
        if: always()

    outputs:
      image_tag: ${{ steps.get_image_tag.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - build_and_publish
    steps:
      - uses: actions/checkout@v2

      - name: Log in with Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: ./scripts/cideploy
        env:
          IMAGE_TAG: ${{needs.build_and_publish.outputs.image_tag}}
          ENVIRONMENT: staging
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
